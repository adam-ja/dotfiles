- clean: ["~"]
- defaults:
    link:
      create: true # Create parent directories to symlinks if they don't already exist
      relink: true # Removes the old link if it's a symlink
      ignore-missing: true # Create the link even though the target won't exist until everything is installed
- link:
    ~/.ignore: misc/ignore
    ~/.config/composer/composer.json: misc/composer.json
    ~/.local/bin/bat: /usr/bin/batcat
    ~/.config/bat/themes: ~/.local/share/nvim/lazy/tokyonight.nvim/extras/sublime
    ~/.config/git/config: git/config
    ~/.local/bin/kitty: ~/.local/kitty.app/bin/kitty
    ~/.config/kitty/kitty.conf: misc/kitty.conf
    ~/.config/nvim: nvim/
    ~/.config/codebook/codebook.toml: misc/codebook.toml
    ~/.config/spaceship.zsh: zsh/spaceship.zsh
    ~/.config/systemd/user/mago.slice: misc/mago.slice
    ~/.config/biome/biome.json: misc/biome.json
    ~/.tmux.conf: tmux/tmux.conf # tmux is supposed to search in ~/.config/tmux/ but for some reason doesn't work
    ~/.claude/:
      glob: true
      path: claude/**
    zsh_custom/themes/spaceship.zsh-theme: zsh_custom/themes/spaceship-prompt/spaceship.zsh-theme
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [~/dotfiles/install_packages.sh, Installing useful packages]
    - [~/dotfiles/apply_configs.sh, Applying configs]
